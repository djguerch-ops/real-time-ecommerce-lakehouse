name: Terraform CI/CD

# Runs terraform plan on every PR/push touching terraform/ files,
# and terraform apply automatically when changes land on main.
on:
  push:
    branches: [main]
    paths:
      - "terraform/envs/dev/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/envs/dev/**"

# Required for OIDC: lets this workflow request a short-lived
# token to prove its identity to AWS — no stored AWS credentials.
permissions:
  id-token: write
  contents: read
  pull-requests: write # so the plan can be posted as a PR comment

env:
  TF_WORKING_DIR: terraform/envs/dev
  AWS_REGION: eu-west-1
  TF_VAR_aws_region: ${{ vars.TF_VAR_aws_region }}
  TF_VAR_raw_bucket_name: ${{ vars.TF_VAR_raw_bucket_name }}
  TF_VAR_checkpoints_bucket_name: ${{ vars.TF_VAR_checkpoints_bucket_name }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Build Lambda deployment package
        run: |
          mkdir -p src/lambda/kinesis_to_s3/build
          cd src/lambda/kinesis_to_s3
          zip -j build/lambda.zip handler.py

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true # warns, doesn't block — formatting nits shouldn't fail a build

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    # Only runs on a direct push to main (e.g. after a PR merge),
    # never on pull_request events — applying infra changes from
    # an unreviewed PR branch would be a real security risk.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform-plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Build Lambda deployment package
        run: |
          mkdir -p src/lambda/kinesis_to_s3/build
          cd src/lambda/kinesis_to_s3
          zip -j build/lambda.zip handler.py

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false
